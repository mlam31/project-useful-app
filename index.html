<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Price Compare" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
    <link data-trunk rel="rust" data-bin="useful_app" data-wasm-opt="2" />
    <title>Price Compare</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: dark;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 24px);
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0 0 14px;
        }

        /* ---------- inputs ---------- */
        input, select {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px; /* 16px prevents iOS zoom-on-focus */
            font-family: inherit;
            padding: 11px 10px;
            outline: none;
            min-width: 0;
        }
        input:focus, select:focus { border-color: #fff; }
        input::placeholder { color: #555; }
        input[type="date"] { padding: 8px 10px; }
        input[type="checkbox"] {
            width: 22px; height: 22px;
            accent-color: #fff;
            padding: 0;
        }
        select.unit-select {
            width: 62px;
            padding: 10px 6px;
            text-align: center;
        }

        .product-input {
            margin-bottom: 14px;
            font-weight: 600;
        }

        /* ---------- verdict ---------- */
        .verdict {
            background: #fff;
            color: #000;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .v-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #666; }
        .v-store { font-size: 20px; font-weight: 700; margin-top: 2px; }
        .v-price { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
        .v-unit { font-size: 14px; font-weight: 600; }
        .v-sub { font-size: 14px; color: #333; margin-top: 2px; }
        .v-save { font-size: 13px; font-weight: 600; margin-top: 8px; }

        .hint {
            font-size: 13px;
            color: #888;
            border: 1px dashed #333;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* ---------- ranking ---------- */
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 11px 12px;
            margin-bottom: 8px;
        }
        .rank-row.best { border-color: #fff; border-width: 1.5px; }
        .rank-store { font-weight: 600; font-size: 15px; }
        .maps-link { color: inherit; text-decoration: underline; text-decoration-color: #555; text-underline-offset: 2px; }
        .maps-link:active { opacity: 0.6; }
        .rank-date { font-size: 11px; color: #777; margin-top: 1px; }
        .promo-badge {
            display: inline-block;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 6px;
            vertical-align: 2px;
        }
        .rank-prices { text-align: right; flex-shrink: 0; }
        .rank-kg { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .rank-unit { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
        .rank-delta { font-size: 11px; color: #777; font-variant-numeric: tabular-nums; }
        .rank-delta.winner { color: #fff; font-weight: 700; }

        /* ---------- offer cards ---------- */
        .card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row + .row { margin-top: 8px; }
        .row .store-input { font-weight: 600; }
        .row .addr-input { font-size: 14px; color: #ccc; }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lbl {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .weight-row { display: flex; gap: 6px; }
        .weight-row input { flex: 1; }

        .meta-row {
            margin-top: 10px;
            justify-content: space-between;
        }
        .date-field { flex: 1; max-width: 180px; }
        .check {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            padding-top: 18px;
        }
        .check input { width: 22px; height: 22px; }

        .quote-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
            font-variant-numeric: tabular-nums;
        }

        .icon-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid #333;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-btn:active { background: #1a1a1a; }

        /* ---------- buttons ---------- */
        button.add-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            padding: 14px;
            margin-top: 4px;
            cursor: pointer;
        }
        button.add-btn:active { background: #ddd; }

        button.clear-btn {
            width: 100%;
            background: transparent;
            color: #777;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: 26px;
            color: #555;
            font-size: 12px;
            line-height: 1.5;
        }
        footer p { margin: 0 0 4px; }
    </style>
</head>
<body>
    <script>
        // Register the service worker when the context is secure (HTTPS or
        // localhost). Over plain HTTP on the LAN the app still works, just
        // without offline caching.
        (function () {
            if (!("serviceWorker" in navigator)) return;
            var host = location.hostname;
            var secure = location.protocol === "https:" || host === "localhost" || host === "127.0.0.1";
            if (secure) {
                navigator.serviceWorker.register("/sw.js").catch(function () {});
            }
        })();
    </script>
</body>
</html>
