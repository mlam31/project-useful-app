<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Price Compare" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
    <link data-trunk rel="rust" data-bin="useful_app" data-wasm-opt="2" />
    <title>Price Compare</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: dark;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 110px);
        }

        .page { min-height: 60vh; }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0 0 14px;
        }

        .section {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 18px 0 10px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 4px 0 10px;
            cursor: pointer;
        }
        .back-btn:active { opacity: 0.6; }

        .product-title, .store-title {
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 12px;
        }
        .store-title {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            border-radius: 0;
            padding: 2px 0 8px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        h1.product-title { margin: 4px 0 14px; }

        /* ---------- inputs ---------- */
        input, select {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px; /* 16px prevents iOS zoom-on-focus */
            font-family: inherit;
            padding: 11px 10px;
            outline: none;
            min-width: 0;
        }
        input:focus, select:focus { border-color: #fff; }
        input::placeholder { color: #555; }
        input[type="date"] { padding: 8px 10px; }
        input[type="checkbox"] {
            width: 22px; height: 22px;
            accent-color: #fff;
            padding: 0;
        }
        select.unit-select {
            width: 62px;
            padding: 10px 6px;
            text-align: center;
        }

        .product-input, .search-input {
            margin-bottom: 14px;
            font-weight: 600;
        }
        .search-input { font-weight: 400; }

        /* ---------- inline add (store name / address) ---------- */
        .add-inline {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .add-inline input { flex: 1; min-width: 0; }
        .mini-add {
            flex-shrink: 0;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            padding: 0 16px;
            cursor: pointer;
        }
        .mini-add:active { background: #ddd; }

        /* ---------- tab bar ---------- */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.92);
            border-top: 1px solid #222;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 10px calc(var(--safe-bottom) + 6px);
            z-index: 10;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #777;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 0;
            border-radius: 12px;
            cursor: pointer;
        }
        .tab.active { color: #fff; background: #161616; }

        /* ---------- store & product list rows ---------- */
        .store-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .store-row:active { background: #161616; }
        .s-info { min-width: 0; }
        .s-name { font-weight: 600; font-size: 16px; }
        .s-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }
        .chev { color: #555; font-size: 20px; flex-shrink: 0; }

        /* ---------- entry rows (products inside a store) ---------- */
        .entry-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .e-info { min-width: 0; flex: 1; }
        .e-name { font-weight: 600; font-size: 15px; }
        .e-meta { font-size: 11px; color: #777; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
        .e-prices { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .e-per { font-size: 13px; color: #bbb; }
        .e-sub { font-size: 15px; font-weight: 700; color: #fff; }

        .icon-btn.small { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }

        /* ---------- chips (suggestions + filters) ---------- */
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip {
            background: #000;
            border: 1px solid #333;
            color: #ccc;
            font-family: inherit;
            font-size: 13px;
            border-radius: 999px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .chip:active { border-color: #fff; color: #fff; }
        .chip.active { background: #fff; color: #000; border-color: #fff; }

        /* bigger filter chips with labels */
        .filter-row .chip {
            font-size: 15px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 12px;
        }

        /* ---------- ⋯ menu for destructive actions ---------- */
        .page-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .dots-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            padding: 6px 12px;
            cursor: pointer;
        }
        .menu-card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 12px;
        }
        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            padding: 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }
        .menu-item:active { background: #1a1a1a; }

        /* ---------- collapsible sections ---------- */
        .collapse-btn {
            width: 100%;
            background: transparent;
            border: 1px dashed #333;
            color: #ccc;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .collapse-btn:active { background: #141414; }
        .form-head { justify-content: space-between; margin-bottom: 8px; }
        .form-title { font-size: 14px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.6px; }

        /* ---------- filter chips row ---------- */
        .filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

        /* ---------- product selection checkbox ---------- */
        .row-check {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: 1.5px solid #555;
            border-radius: 8px;
            background: transparent;
            color: #000;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .row-check.checked { background: #fff; border-color: #fff; }

        .add-btn.compare { margin-top: 10px; }

        /* ---------- settings ---------- */
        .cur-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .cur-info { flex: 1; min-width: 0; }
        .rate-input {
            width: 96px;
            flex-shrink: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 8px;
        }
        .main-select { margin-bottom: 6px; }
        .settings-note { font-size: 12px; color: #777; margin: 2px 0 10px; }
        .hint.error { border-style: solid; border-color: #777; color: #ddd; }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        select.unit-select.wide { width: 100%; text-align: left; }

        /* ---------- verdict ---------- */
        .verdict {
            background: #fff;
            color: #000;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .v-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #666; }
        .v-store { font-size: 20px; font-weight: 700; margin-top: 2px; }
        .v-price { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
        .v-unit { font-size: 14px; font-weight: 600; }
        .v-sub { font-size: 14px; color: #333; margin-top: 2px; }
        .v-save { font-size: 13px; font-weight: 600; margin-top: 8px; }

        .hint {
            font-size: 13px;
            color: #888;
            border: 1px dashed #333;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* ---------- ranking ---------- */
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 11px 12px;
            margin-bottom: 8px;
        }
        .rank-row.best { border-color: #fff; border-width: 1.5px; }
        .rank-store { font-weight: 600; font-size: 15px; }
        .maps-link { color: inherit; text-decoration: underline; text-decoration-color: #555; text-underline-offset: 2px; }
        .maps-link:active { opacity: 0.6; }
        .rank-date { font-size: 11px; color: #777; margin-top: 1px; }
        .promo-badge {
            display: inline-block;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 6px;
            vertical-align: 2px;
        }
        .rank-prices { text-align: right; flex-shrink: 0; }
        .rank-kg { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .rank-unit { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
        .rank-delta { font-size: 11px; color: #777; font-variant-numeric: tabular-nums; }
        .rank-delta.winner { color: #fff; font-weight: 700; }
        .rank-orig { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; }
        .rank-sec { font-size: 11px; color: #999; font-variant-numeric: tabular-nums; }

        /* ---------- offer cards ---------- */
        .card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row + .row { margin-top: 8px; }
        .row .store-input { font-weight: 600; }
        .row .addr-input { font-size: 14px; color: #ccc; }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lbl {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .weight-row { display: flex; gap: 6px; }
        .weight-row input { flex: 1; }

        .meta-row {
            margin-top: 10px;
            justify-content: space-between;
        }
        .date-field { flex: 1; max-width: 180px; }
        .check {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            padding-top: 18px;
        }
        .check input { width: 22px; height: 22px; }

        .quote-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
            font-variant-numeric: tabular-nums;
        }

        .icon-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid #333;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-btn:active { background: #1a1a1a; }

        /* ---------- buttons ---------- */
        button.add-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            padding: 14px;
            margin-top: 4px;
            cursor: pointer;
        }
        button.add-btn:active { background: #ddd; }

        button.clear-btn {
            width: 100%;
            background: transparent;
            color: #777;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: 26px;
            color: #555;
            font-size: 12px;
            line-height: 1.5;
        }
        footer p { margin: 0 0 4px; }
    </style>
</head>
<body>
    <script>
        // Register the service worker when the context is secure (HTTPS or
        // localhost). Over plain HTTP on the LAN the app still works, just
        // without offline caching.
        (function () {
            if (!("serviceWorker" in navigator)) return;
            var host = location.hostname;
            var secure = location.protocol === "https:" || host === "localhost" || host === "127.0.0.1";
            if (secure) {
                navigator.serviceWorker.register("/sw.js").catch(function () {});
            }
        })();
    </script>
</body>
</html>
