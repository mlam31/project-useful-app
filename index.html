<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Product Tracker" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" />
    <link data-trunk rel="copy-dir" href="public" data-target-path="." />
    <link data-trunk rel="rust" data-bin="useful_app" data-wasm-opt="2" />
    <title>Product Tracker</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #000000;
            --surface: #0b0b0b;
            --surface-2: #111111;
            --surface-3: #161616;
            --border: #242424;
            --border-strong: #3a3a3a;
            --text: #f5f5f5;
            --text-secondary: #b3b3b3;
            --text-tertiary: #808080;
            --text-faint: #5c5c5c;
            --accent: #ffffff;
            --accent-fg: #000000;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-7: 32px;
            color-scheme: dark;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            font-size: 16px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--safe-top) + var(--space-5)) var(--space-4) calc(var(--safe-bottom) + 124px);
        }

        .page { min-height: 60vh; }
        .page > .hint:first-of-type { margin-top: 0; }

        header,
        .page-head {
            position: sticky;
            top: 0;
            z-index: 15;
            background: linear-gradient(to bottom, var(--bg) 70%, rgba(0,0,0,0));
            padding-top: 2px;
            padding-bottom: var(--space-3);
            margin-bottom: var(--space-2);
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-2);
            padding-right: 84px;
            min-height: 44px;
        }

        header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin: 0;
            padding-right: 84px;
            min-height: 40px;
            display: flex;
            align-items: center;
            color: var(--text);
        }

        .section {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: var(--space-6) 0 var(--space-3);
        }
        .section:first-of-type { margin-top: var(--space-4); }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 0;
            cursor: pointer;
        }
        .back-btn:active { color: var(--text); }

        .product-title, .store-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.2;
            margin: 0 0 var(--space-4);
            color: var(--text);
        }
        .store-title {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 4px 0 10px;
            margin-bottom: var(--space-3);
            font-weight: 700;
        }

        h1.product-title { margin: 4px 0 var(--space-4); }

        /* ---------- inputs ---------- */
        input, select, textarea {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 16px; /* 16px prevents iOS zoom-on-focus */
            font-family: inherit;
            padding: 12px 14px;
            outline: none;
            min-width: 0;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--border-strong);
            background: var(--surface-2);
        }
        input::placeholder, textarea::placeholder { color: var(--text-faint); }
        input[type="date"] { padding: 10px 14px; }
        input[type="checkbox"] {
            width: 22px; height: 22px;
            accent-color: #fff;
            padding: 0;
        }
        select.unit-select {
            width: 100%;
            padding: 12px 14px;
            text-align: left;
        }

        .product-input, .search-input {
            margin-bottom: var(--space-4);
            font-weight: 500;
        }
        .search-input {
            font-weight: 400;
            background: var(--surface);
            border-color: var(--border);
        }
        .search-wrap { position: relative; margin-bottom: var(--space-4); }
        .search-wrap .search-input { margin-bottom: 0; padding-right: 48px; }
        .search-add {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px; height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--surface-2); color: var(--text);
            font-size: 20px; line-height: 1;
            cursor: pointer; padding: 0;
        }
        .stepper { display: flex; align-items: center; gap: var(--space-2); }
        .stepper input { flex: 1; text-align: center; min-width: 0; }
        .step-btn {
            flex-shrink: 0; width: 40px; height: 40px;
            border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
            background: var(--surface-2); color: var(--text);
            font-size: 20px; line-height: 1; cursor: pointer; padding: 0;
        }
        .step-btn:active { background: var(--surface-3); }

        /* ---------- inline add (store name / address) ---------- */
        .add-inline {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        .add-inline input { flex: 1; min-width: 0; }
        .mini-add {
            flex-shrink: 0;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            padding: 0 16px;
            cursor: pointer;
        }
        .mini-add:active { background: #e6e6e6; }

        /* ---------- tab bar ---------- */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            margin: 0;
            display: flex;
            gap: var(--space-2);
            background: rgba(5, 5, 5, 0.94);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px var(--space-3) calc(var(--safe-bottom) + 8px);
            z-index: 10;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-tertiary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            padding: 10px 0;
            border-radius: 12px;
            cursor: pointer;
        }
        .tab.active {
            color: var(--text);
            background: var(--surface-3);
            border-color: var(--border);
        }
        .scan-fab {
            position: fixed;
            top: calc(var(--safe-top) + 10px);
            right: 16px;
            z-index: 20;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }

        /* ---------- store & product list rows ---------- */
        .store-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-3);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 15px 16px;
            margin-bottom: var(--space-3);
            cursor: pointer;
        }
        .store-row:active { background: var(--surface-2); }
        .s-info { min-width: 0; flex: 1; }
        .s-name {
            font-weight: 600;
            font-size: 16px;
            line-height: 1.3;
            color: var(--text);
        }
        .s-sub {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-tertiary);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }
        .chev { color: var(--text-faint); font-size: 20px; flex-shrink: 0; }

        /* ---------- entry rows (products inside a store) ---------- */
        .entry-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            overflow: hidden;
        }
        .entry-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: 15px 16px;
            cursor: pointer;
        }
        .entry-menu {
            border-top: 1px solid var(--border);
            padding: var(--space-4);
            background: #080808;
        }
        .entry-detail {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            line-height: 1.5;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-3);
        }
        .ed-date { color: var(--text-tertiary); white-space: nowrap; }
        .ed-prices { text-align: right; flex: 1; color: var(--text-secondary); }
        .entry-history { margin: var(--space-2) 0 var(--space-3); padding-top: var(--space-3); border-top: 1px dashed var(--border-strong); }
        .eh-title { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .eh-body { margin: 0; font-family: inherit; font-size: 12px; color: var(--text-secondary); white-space: pre-wrap; line-height: 1.6; }
        .grade { font-size: 22px; font-weight: 800; padding: 8px 10px; border-radius: 12px; border: 1px solid #333; min-width: 72px; text-align: center; }
        .grade.good { background: #0f1f0f; color: #7dff7d; border-color: #2f5a2f; }
        .grade.mid { background: #1f1a0f; color: #ffd36a; border-color: #5a4a2f; }
        .grade.bad { background: #1f0f0f; color: #ff8a8a; border-color: #5a2f2f; }
        .ing-list { margin: 4px 0 0 18px; padding: 0; font-size: 13px; line-height: 1.5; }
        .ing-list.good { color: #bfe6bf; }
        .ing-list.bad { color: #e6bfbf; }
        .rate-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid #333; margin-top: 4px; display: inline-block; }
        .rate-badge.good { color: #7dff7d; border-color: #2f5a2f; background: #0f1f0f; }
        .rate-badge.mid { color: #ffd36a; border-color: #5a4a2f; background: #1f1a0f; }
        .rate-badge.bad { color: #ff8a8a; border-color: #5a2f2f; background: #1f0f0f; }
        .entry-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 4px; }
        .entry-actions .menu-item {
            width: auto;
            flex: 1 1 auto;
            text-align: center;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface-2);
        }
        .copy-list { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px dashed var(--border-strong); }
        .dots-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            padding: 6px 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .row-check {
            width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--border-strong);
            background: transparent; color: #000; font-size: 14px; font-weight: 700;
            flex-shrink: 0; cursor: pointer; padding: 0; line-height: 1;
        }
        .row-check.checked { background: var(--accent); border-color: var(--accent); }
        .e-info { min-width: 0; flex: 1; }
        .e-name { font-weight: 600; font-size: 16px; line-height: 1.3; margin-bottom: 2px; color: var(--text); }
        .e-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
        .e-prices { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .e-sub { font-size: 15px; font-weight: 700; color: var(--text); }
        .e-sec { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .e-per { font-size: 12px; color: var(--text-tertiary); }
        .e-paid { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
        .e-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

        .icon-btn.small { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }

        /* ---------- chips (suggestions + filters) ---------- */
        .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: 999px;
            padding: 7px 12px;
            cursor: pointer;
        }
        .chip:active { border-color: var(--border-strong); color: var(--text); }
        .chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }

        /* bigger filter chips with labels */
        .filter-row .chip {
            font-size: 14px;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 999px;
        }

        /* ---------- ⋯ menu for destructive actions ---------- */
        .menu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 6px;
            margin-bottom: var(--space-4);
        }
        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            padding: 12px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
        }
        .menu-item:active { background: var(--surface-2); }

        /* ---------- collapsible sections ---------- */
        .collapse-btn {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: var(--space-4);
            cursor: pointer;
            text-align: left;
        }
        .collapse-btn:active { background: var(--surface-2); color: var(--text); }
        .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); }
        .form-title { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }

        /* ---------- filter chips row ---------- */
        .filter-row {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-row .chip { flex: 0 0 auto; white-space: nowrap; }

        .add-btn.compare { margin-top: var(--space-2); }

        /* ---------- settings ---------- */
        .cur-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: var(--space-2);
        }
        .cur-info { flex: 1; min-width: 0; }
        .rate-input {
            width: 104px;
            flex-shrink: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 10px 12px;
        }
        .main-select { margin-bottom: var(--space-2); }
        .settings-note { font-size: 13px; line-height: 1.5; color: var(--text-tertiary); margin: 0 0 var(--space-3); }
        .hint.error { border-style: solid; border-color: #666; color: #ddd; }

        .grid2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--space-2);
            margin-top: var(--space-2);
        }
        select.unit-select.wide { width: 100%; text-align: left; }

        /* ---------- verdict ---------- */
        .verdict {
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: var(--radius-lg);
            padding: 18px 18px 16px;
            margin-bottom: var(--space-5);
            box-shadow: 0 8px 24px rgba(255,255,255,0.06);
        }
        .v-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #555; }
        .v-store { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-top: 4px; line-height: 1.2; }
        .v-price { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; margin-top: 6px; line-height: 1; }
        .v-unit { font-size: 15px; font-weight: 600; letter-spacing: 0; }
        .v-sub { font-size: 14px; color: #333; margin-top: 4px; }
        .v-save { font-size: 13px; font-weight: 600; margin-top: 10px; color: #222; }

        .hint {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: var(--space-4);
            line-height: 1.5;
        }

        /* ---------- ranking ---------- */
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-3);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 14px;
            margin-bottom: var(--space-2);
        }
        .rank-row.best { border-color: #fff; border-width: 1.5px; background: #101010; }
        .rank-store { font-weight: 600; font-size: 15px; line-height: 1.35; color: var(--text); }
        .maps-link { color: inherit; text-decoration: underline; text-decoration-color: #555; text-underline-offset: 3px; }
        .maps-link:active { opacity: 0.6; }
        .rank-date { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
        .promo-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-fg);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            border-radius: 4px;
            padding: 2px 6px;
            margin-left: 6px;
            vertical-align: 2px;
        }
        .rank-prices { text-align: right; flex-shrink: 0; }
        .rank-kg { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
        .rank-unit { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-top: 2px; }
        .rank-delta { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-top: 2px; }
        .rank-delta.winner { color: #fff; font-weight: 700; }
        .rank-orig { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; margin-top: 2px; }
        .rank-sec { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

        /* ---------- offer cards ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: var(--space-4);
        }
        .row { display: flex; gap: var(--space-2); align-items: center; }
        .row + .row { margin-top: var(--space-2); }
        .row .store-input { font-weight: 600; }
        .row .addr-input { font-size: 14px; color: var(--text-secondary); }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: var(--space-2);
            margin-top: var(--space-3);
        }
        .field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
        /* Uniform 8px rhythm between form rows (standalone field rows inside cards). */
        .card > .field:not(:first-child) { margin-top: var(--space-2); }
        .lbl {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .weight-row { display: flex; gap: 6px; }
        .weight-row input { flex: 1; }

        .meta-row {
            margin-top: var(--space-2);
            justify-content: space-between;
        }
        .date-field { flex: 1; max-width: 180px; }
        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .check input { width: 22px; height: 22px; }

        .quote-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .icon-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-btn:active { background: var(--surface-2); color: var(--text); }

        /* ---------- buttons ---------- */
        button.add-btn {
            width: 100%;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            padding: 14px 16px;
            margin-top: var(--space-2);
            cursor: pointer;
            letter-spacing: 0.01em;
        }
        button.add-btn:active { background: #e6e6e6; }

        button.clear-btn {
            width: 100%;
            background: transparent;
            color: var(--text-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            padding: 12px 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: var(--space-7);
            color: var(--text-faint);
            font-size: 12px;
            line-height: 1.6;
        }
        footer p { margin: 0 0 4px; }
    </style>
</head>
<body>
    <script>
        // Register the service worker when the context is secure (HTTPS or
        // localhost). Over plain HTTP on the LAN the app still works, just
        // without offline caching.
        (function () {
            if (!("serviceWorker" in navigator)) return;
            var host = location.hostname;
            var secure = location.protocol === "https:" || host === "localhost" || host === "127.0.0.1";
            if (secure) {
                navigator.serviceWorker.register("./sw.js").catch(function () {});
            }
        })();

        // Camera barcode scan helpers (used by WASM).
        // Prefers native BarcodeDetector; falls back to ZXing (loaded on demand) for browsers like iOS Safari.
        window.__scanStream = null;
        window.__scanTimer = null;
        window.__scanDetector = null;
        window.__scanZxing = null;
        window.__zxingLoadPromise = null;

        window.__ensureZXing = function() {
            if (window.ZXing) return Promise.resolve();
            if (window.__zxingLoadPromise) return window.__zxingLoadPromise;
            window.__zxingLoadPromise = new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
                s.async = true;
                s.onload = function() { window.ZXing ? resolve() : reject(new Error('ZXing library unavailable')); };
                s.onerror = function() { reject(new Error('Could not load barcode scanner library')); };
                document.head.appendChild(s);
            });
            return window.__zxingLoadPromise;
        };

        window.__waitForScanHost = function(attempts) {
            return new Promise(function(resolve) {
                var tries = attempts || 20;
                (function poll() {
                    var host = document.getElementById('scan-video-host');
                    if (host) return resolve(host);
                    if (tries-- <= 0) return resolve(null);
                    setTimeout(poll, 50);
                })();
            });
        };

        window.startBarcodeScan = async function(onResult, onError) {
            try {
                var host = await window.__waitForScanHost(20);
                if (!host) { onError('Scan view not ready'); window.stopBarcodeScan(); return false; }
                host.innerHTML = '';
                var video = document.createElement('video');
                video.id = 'scan-video';
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.muted = true;
                video.style.width = '100%';
                // Fixed preview frame: without a set height the element starts
                // at the 300x150 default and jumps to the stream's intrinsic
                // size once frames arrive (looks like a zoom/grow animation).
                video.style.height = '280px';
                video.style.objectFit = 'cover';
                video.style.borderRadius = '12px';
                video.style.background = '#000';
                host.appendChild(video);

                if ('BarcodeDetector' in window) {
                    var formats = ['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'];
                    try { formats = await window.BarcodeDetector.getSupportedFormats(); } catch(e) {}
                    window.__scanDetector = new window.BarcodeDetector({ formats: (formats && formats.length) ? formats : ['ean_13','ean_8','upc_a','upc_e'] });
                    var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                    window.__scanStream = stream;
                    video.srcObject = stream;
                    try { await video.play(); } catch(e) {}
                    var detect = async function() {
                        try {
                            if (!window.__scanDetector || !video || video.readyState < 2) return;
                            var barcodes = await window.__scanDetector.detect(video);
                            if (barcodes && barcodes.length > 0) {
                                var value = barcodes[0].rawValue || '';
                                if (value) {
                                    window.stopBarcodeScan();
                                    onResult(value);
                                }
                            }
                        } catch (e) { /* ignore frame errors */ }
                    };
                    window.__scanTimer = setInterval(detect, 400);
                    return true;
                }

                // Fallback: ZXing (works on browsers without BarcodeDetector, e.g. iOS Safari)
                await window.__ensureZXing();
                var HintMap = (window.ZXing && window.ZXing.Map) ? window.ZXing.Map : Map;
                var hints = new HintMap();
                var formats = [
                    window.ZXing.BarcodeFormat.EAN_13,
                    window.ZXing.BarcodeFormat.EAN_8,
                    window.ZXing.BarcodeFormat.UPC_A,
                    window.ZXing.BarcodeFormat.UPC_E,
                    window.ZXing.BarcodeFormat.CODE_128,
                    window.ZXing.BarcodeFormat.QR_CODE
                ];
                if (window.ZXing.DecodeHintType && window.ZXing.DecodeHintType.POSSIBLE_FORMATS != null) {
                    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
                }
                var reader = new window.ZXing.BrowserMultiFormatReader(hints, 400);
                window.__scanZxing = reader;
                await reader.decodeFromConstraints({ audio: false, video: { facingMode: { ideal: 'environment' } } }, video, function(result, err) {
                    if (result && result.getText) {
                        var value = result.getText();
                        if (value) {
                            window.stopBarcodeScan();
                            onResult(value);
                        }
                    }
                    // ignore not-found frame errors
                });
                return true;
            } catch (e) {
                onError('Camera access failed: ' + (e && e.message ? e.message : String(e)) + '. On iPhone, camera needs HTTPS (or localhost) and camera permission. You can enter the barcode manually.');
                window.stopBarcodeScan();
                return false;
            }
        };

        window.stopBarcodeScan = function() {
            if (window.__scanTimer) { clearInterval(window.__scanTimer); window.__scanTimer = null; }
            if (window.__scanZxing) {
                try { window.__scanZxing.reset(); } catch(e){}
                window.__scanZxing = null;
            }
            if (window.__scanStream) {
                try { window.__scanStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
                window.__scanStream = null;
            }
            var video = document.getElementById('scan-video');
            if (video) { try { video.srcObject = null; } catch(e){} }
            var host = document.getElementById('scan-video-host');
            if (host) { host.innerHTML = ''; }
        };
    </script>
</body>
</html>
