[package]
name = "useful_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "useful_app"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "Navigator",
    "Coordinates",
    "Geolocation",
    "Position",
    "PositionError",
    "PositionOptions",
] }
gloo-net = "0.6"
