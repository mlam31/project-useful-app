<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Price Compare" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" />
    <link data-trunk rel="rust" data-bin="useful_app" data-wasm-opt="2" />
    <title>Price Compare</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: dark;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 110px);
        }

        .page { min-height: 60vh; padding-top: 8px; }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 0 0 14px;
        }

        .section {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 18px 0 10px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 4px 0 10px;
            cursor: pointer;
        }
        .back-btn:active { opacity: 0.6; }

        .product-title, .store-title {
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 12px;
        }
        .store-title {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            border-radius: 0;
            padding: 2px 0 8px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        h1.product-title { margin: 4px 0 14px; }

        /* ---------- inputs ---------- */
        input, select {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px; /* 16px prevents iOS zoom-on-focus */
            font-family: inherit;
            padding: 11px 10px;
            outline: none;
            min-width: 0;
        }
        input:focus, select:focus { border-color: #fff; }
        input::placeholder { color: #555; }
        input[type="date"] { padding: 8px 10px; }
        input[type="checkbox"] {
            width: 22px; height: 22px;
            accent-color: #fff;
            padding: 0;
        }
        select.unit-select {
            width: 100%;
            padding: 10px 8px;
            text-align: left;
        }

        .product-input, .search-input {
            margin-bottom: 14px;
            font-weight: 600;
        }
        .search-input { font-weight: 400; }
        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-add {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px; height: 32px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111; color: #fff;
            font-size: 20px; line-height: 1;
            cursor: pointer; padding: 0;
        }
        .stepper { display: flex; align-items: center; gap: 6px; }
        .stepper input { flex: 1; text-align: center; min-width: 0; }
        .step-btn {
            flex-shrink: 0; width: 38px; height: 38px;
            border-radius: 10px; border: 1px solid #444;
            background: #111; color: #fff;
            font-size: 20px; line-height: 1; cursor: pointer; padding: 0;
        }
        .step-btn:active { background: #222; }

        /* ---------- inline add (store name / address) ---------- */
        .add-inline {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .add-inline input { flex: 1; min-width: 0; }
        .mini-add {
            flex-shrink: 0;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            padding: 0 16px;
            cursor: pointer;
        }
        .mini-add:active { background: #ddd; }

        /* ---------- tab bar ---------- */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.92);
            border-top: 1px solid #222;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 10px calc(var(--safe-bottom) + 6px);
            z-index: 10;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #777;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 0;
            border-radius: 12px;
            cursor: pointer;
        }
        .tab.active { color: #fff; background: #161616; }
        .scan-fab {
            position: fixed;
            top: calc(var(--safe-top) + 10px);
            right: 16px;
            z-index: 20;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ---------- store & product list rows ---------- */
        .store-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 14px 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .store-row:active { background: #161616; }
        .s-info { min-width: 0; }
        .s-name { font-weight: 600; font-size: 16px; }
        .s-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }
        .chev { color: #555; font-size: 20px; flex-shrink: 0; }

        /* ---------- entry rows (products inside a store) ---------- */
        .entry-card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .entry-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px;
            cursor: pointer;
        }
        .entry-menu {
            border-top: 1px solid #222;
            padding: 14px;
            background: #080808;
        }
        .entry-detail {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 8px;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .ed-date { color: #999; white-space: nowrap; }
        .ed-prices { text-align: right; flex: 1; }
        .entry-history { margin: 8px 0 10px; padding-top: 8px; border-top: 1px dashed #333; }
        .eh-title { font-size: 12px; color: #888; margin-bottom: 4px; font-weight: 600; }
        .eh-body { margin: 0; font-family: inherit; font-size: 12px; color: #aaa; white-space: pre-wrap; line-height: 1.5; }
        .grade { font-size: 22px; font-weight: 800; padding: 8px 10px; border-radius: 12px; border: 1px solid #333; min-width: 72px; text-align: center; }
        .grade.good { background: #0f1f0f; color: #7dff7d; border-color: #2f5a2f; }
        .grade.mid { background: #1f1a0f; color: #ffd36a; border-color: #5a4a2f; }
        .grade.bad { background: #1f0f0f; color: #ff8a8a; border-color: #5a2f2f; }
        .ing-list { margin: 4px 0 0 18px; padding: 0; font-size: 13px; line-height: 1.4; }
        .ing-list.good { color: #bfe6bf; }
        .ing-list.bad { color: #e6bfbf; }
        .rate-badge { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 8px; border: 1px solid #333; margin-top: 4px; display: inline-block; }
        .rate-badge.good { color: #7dff7d; border-color: #2f5a2f; }
        .rate-badge.mid { color: #ffd36a; border-color: #5a4a2f; }
        .rate-badge.bad { color: #ff8a8a; border-color: #5a2f2f; }
        .entry-row { gap: 12px; }
        .entry-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .entry-actions .menu-item {
            width: auto;
            flex: 1 1 auto;
            text-align: center;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }
        .copy-list { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #333; }
        .dots-btn { background: transparent; border: none; color: #888; font-size: 22px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; }
        .row-check {
            width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid #555;
            background: transparent; color: #000; font-size: 14px; font-weight: 700;
            flex-shrink: 0; cursor: pointer; padding: 0; line-height: 1;
        }
        .row-check.checked { background: #fff; border-color: #fff; }
        .e-info { min-width: 0; flex: 1; }
        .e-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
        .e-meta { font-size: 11px; color: #777; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
        .e-prices { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .e-sub { font-size: 15px; font-weight: 700; color: #fff; }
        .e-sec { font-size: 12px; color: #aaa; margin-top: 2px; }
        .e-per { font-size: 12px; color: #888; }

        .icon-btn.small { width: 32px; height: 32px; font-size: 13px; border-radius: 8px; }

        /* ---------- chips (suggestions + filters) ---------- */
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip {
            background: #000;
            border: 1px solid #333;
            color: #ccc;
            font-family: inherit;
            font-size: 13px;
            border-radius: 999px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .chip:active { border-color: #fff; color: #fff; }
        .chip.active { background: #fff; color: #000; border-color: #fff; }

        /* bigger filter chips with labels */
        .filter-row .chip {
            font-size: 15px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 12px;
        }

        /* ---------- ⋯ menu for destructive actions ---------- */
        .page-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .dots-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            padding: 6px 12px;
            cursor: pointer;
        }
        .menu-card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 12px;
        }
        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            padding: 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }
        .menu-item:active { background: #1a1a1a; }

        /* ---------- collapsible sections ---------- */
        .collapse-btn {
            width: 100%;
            background: transparent;
            border: 1px dashed #333;
            color: #ccc;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .collapse-btn:active { background: #141414; }
        .form-head { justify-content: space-between; margin-bottom: 8px; }
        .form-title { font-size: 14px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.6px; }

        /* ---------- filter chips row ---------- */
        .filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

        /* ---------- product selection checkbox ---------- */
        .row-check {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: 1.5px solid #555;
            border-radius: 8px;
            background: transparent;
            color: #000;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .row-check.checked { background: #fff; border-color: #fff; }

        .add-btn.compare { margin-top: 10px; }

        /* ---------- settings ---------- */
        .cur-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .cur-info { flex: 1; min-width: 0; }
        .rate-input {
            width: 96px;
            flex-shrink: 0;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 8px;
        }
        .main-select { margin-bottom: 6px; }
        .settings-note { font-size: 12px; color: #777; margin: 2px 0 10px; }
        .hint.error { border-style: solid; border-color: #777; color: #ddd; }

        .grid2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .e-paid { font-size: 14px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
        .e-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .e-info { min-width: 0; flex: 1; }
        select.unit-select.wide { width: 100%; text-align: left; }

        /* ---------- verdict ---------- */
        .verdict {
            background: #fff;
            color: #000;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .v-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #666; }
        .v-store { font-size: 20px; font-weight: 700; margin-top: 2px; }
        .v-price { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
        .v-unit { font-size: 14px; font-weight: 600; }
        .v-sub { font-size: 14px; color: #333; margin-top: 2px; }
        .v-save { font-size: 13px; font-weight: 600; margin-top: 8px; }

        .hint {
            font-size: 13px;
            color: #888;
            border: 1px dashed #333;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* ---------- ranking ---------- */
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 11px 12px;
            margin-bottom: 8px;
        }
        .rank-row.best { border-color: #fff; border-width: 1.5px; }
        .rank-store { font-weight: 600; font-size: 15px; }
        .maps-link { color: inherit; text-decoration: underline; text-decoration-color: #555; text-underline-offset: 2px; }
        .maps-link:active { opacity: 0.6; }
        .rank-date { font-size: 11px; color: #777; margin-top: 1px; }
        .promo-badge {
            display: inline-block;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 6px;
            vertical-align: 2px;
        }
        .rank-prices { text-align: right; flex-shrink: 0; }
        .rank-kg { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .rank-unit { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
        .rank-delta { font-size: 11px; color: #777; font-variant-numeric: tabular-nums; }
        .rank-delta.winner { color: #fff; font-weight: 700; }
        .rank-orig { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; }
        .rank-sec { font-size: 11px; color: #999; font-variant-numeric: tabular-nums; }

        /* ---------- offer cards ---------- */
        .card {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row + .row { margin-top: 8px; }
        .row .store-input { font-weight: 600; }
        .row .addr-input { font-size: 14px; color: #ccc; }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lbl {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .weight-row { display: flex; gap: 6px; }
        .weight-row input { flex: 1; }

        .meta-row {
            margin-top: 10px;
            justify-content: space-between;
        }
        .date-field { flex: 1; max-width: 180px; }
        .check {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            padding-top: 18px;
        }
        .check input { width: 22px; height: 22px; }

        .quote-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
            font-variant-numeric: tabular-nums;
        }

        .icon-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid #333;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .icon-btn:active { background: #1a1a1a; }

        /* ---------- buttons ---------- */
        button.add-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            padding: 14px;
            margin-top: 4px;
            cursor: pointer;
        }
        button.add-btn:active { background: #ddd; }

        button.clear-btn {
            width: 100%;
            background: transparent;
            color: #777;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: 26px;
            color: #555;
            font-size: 12px;
            line-height: 1.5;
        }
        footer p { margin: 0 0 4px; }
    </style>
</head>
<body>
    <script>
        // Register the service worker when the context is secure (HTTPS or
        // localhost). Over plain HTTP on the LAN the app still works, just
        // without offline caching.
        (function () {
            if (!("serviceWorker" in navigator)) return;
            var host = location.hostname;
            var secure = location.protocol === "https:" || host === "localhost" || host === "127.0.0.1";
            if (secure) {
                navigator.serviceWorker.register("./sw.js").catch(function () {});
            }
        })();

        // Camera barcode scan helpers (used by WASM). Uses BarcodeDetector when available.
        window.__scanStream = null;
        window.__scanTimer = null;
        window.__scanDetector = null;

        window.startBarcodeScan = async function(onResult, onError) {
            try {
                if (!('BarcodeDetector' in window)) {
                    onError('BarcodeDetector not supported on this browser. You can enter the barcode number manually.');
                    return false;
                }
                var formats = ['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'];
                try { formats = await window.BarcodeDetector.getSupportedFormats(); } catch(e) {}
                window.__scanDetector = new window.BarcodeDetector({ formats: (formats && formats.length) ? formats : ['ean_13','ean_8','upc_a','upc_e'] });
                var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                window.__scanStream = stream;
                var host = document.getElementById('scan-video-host');
                if (!host) { onError('Scan view not ready'); window.stopBarcodeScan(); return false; }
                host.innerHTML = '';
                var video = document.createElement('video');
                video.id = 'scan-video';
                video.setAttribute('playsinline', '');
                video.setAttribute('autoplay', '');
                video.muted = true;
                video.style.width = '100%';
                video.style.borderRadius = '12px';
                video.style.background = '#000';
                host.appendChild(video);
                video.srcObject = stream;
                try { await video.play(); } catch(e) {}
                var detect = async function() {
                    try {
                        if (!window.__scanDetector || !video || video.readyState < 2) return;
                        var barcodes = await window.__scanDetector.detect(video);
                        if (barcodes && barcodes.length > 0) {
                            var value = barcodes[0].rawValue || '';
                            if (value) {
                                window.stopBarcodeScan();
                                onResult(value);
                            }
                        }
                    } catch (e) { /* ignore frame errors */ }
                };
                window.__scanTimer = setInterval(detect, 400);
                return true;
            } catch (e) {
                onError('Camera access failed: ' + (e && e.message ? e.message : String(e)) + '. On iPhone, camera needs HTTPS (or localhost). You can enter the barcode manually.');
                window.stopBarcodeScan();
                return false;
            }
        };

        window.stopBarcodeScan = function() {
            if (window.__scanTimer) { clearInterval(window.__scanTimer); window.__scanTimer = null; }
            if (window.__scanStream) {
                try { window.__scanStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
                window.__scanStream = null;
            }
            var video = document.getElementById('scan-video');
            if (video) { try { video.srcObject = null; } catch(e){} }
            var host = document.getElementById('scan-video-host');
            if (host) { host.innerHTML = ''; }
        };
    </script>
</body>
</html>
